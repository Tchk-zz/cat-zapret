      <g transform="translate(192)"><rect width="196" height="44" rx="22" fill="#ffffff" fill-opacity=".09" stroke="#a78bfa" stroke-opacity=".38"/><text x="22" y="28" fill="#f5f3ff">Полная синхронизация</text></g>
