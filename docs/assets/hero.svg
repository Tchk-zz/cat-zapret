<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Zapret GUI</title>
  <desc id="desc">Стильный баннер независимого Windows-интерфейса для Zapret</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090f"/>
      <stop offset="0.5" stop-color="#171329"/>
      <stop offset="1" stop-color="#30165b"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#d8b4fe" stop-opacity=".95"/>
      <stop offset=".38" stop-color="#8b5cf6" stop-opacity=".72"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
