version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      python-runtime:
        patterns:
          - PyQt6
          - requests
          - cryptography
          - pywin32
      python-tooling:
        patterns:
          - pytest
          - pytest-qt
          - pyflakes
          - pyinstaller

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 3
    labels:
      - dependencies
