# Release pipeline: build the exe, wrap it into the installer and publish the
# GitHub release with the installer attached.
#
# It is triggered by a v* tag, so cutting a release is one command locally:
#
#     git tag v1.9.4 && git push origin v1.9.4
#
# workflow_dispatch exists for a re-run after a job failed with the tag already
# pushed: tools/publish_release.py reuses an existing release and replaces the
# asset instead of failing, so re-running is safe.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The job creates a release and uploads an asset, so the default read-only
# token would not be enough.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Same interpreter as the tests workflow and as local development, so the
      # published exe is built by the Python the suite actually ran on.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install "pyinstaller>=6.0"

      # Never publish something that would be red on main: the two gates of the
      # tests workflow run before anything is compiled.
      - name: Static analysis (pyflakes)
        run: python tools/check_lint.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --no-header

      # VERSION is the single source of truth: app/__init__.py, installer.iss and
      # the CHANGELOG section all follow it. A tag that disagrees with it would
      # publish a release whose in-app version differs from its name, and the
      # in-app updater compares exactly those numbers.
      - name: Resolve the version and check it matches the tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must be N.N.N, got '$version'"
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME does not match VERSION $version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $version"

      # The zapret binaries are not vendored in Git; build.bat pulls them the
      # same way before every local build.
      - name: Fetch the zapret binaries
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File fetch_zapret.ps1
          if ($LASTEXITCODE -ne 0) { throw "fetch_zapret.ps1 failed with $LASTEXITCODE" }
          if (-not (Test-Path "vendor/zapret/bin/winws.exe")) {
            throw "vendor/zapret/bin/winws.exe is missing after fetch_zapret.ps1"
          }

      # build.bat / build_installer.bat are deliberately not used here: they are
      # written for a double-click and call `pause`, which would hang the runner
      # until the job times out.
      - name: Build ZapretGUI.exe
        shell: pwsh
        run: |
          python -m PyInstaller zapret-gui.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with $LASTEXITCODE" }
          if (-not (Test-Path "dist/ZapretGUI.exe")) {
            throw "PyInstaller finished but dist/ZapretGUI.exe is missing"
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc).Source }
          & $iscc /Qp "/DMyAppVersion=${{ steps.version.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          if (-not (Test-Path "Output/ZapretGUI-Setup.exe")) {
            throw "ISCC finished but Output/ZapretGUI-Setup.exe is missing"
          }
          $digest = (Get-FileHash "Output/ZapretGUI-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $digest"

      # Kept even when publishing fails, so a token problem never costs a rebuild.
      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapretGUI-Setup-${{ steps.version.outputs.version }}
          path: Output/ZapretGUI-Setup.exe
          if-no-files-found: error

      # The very script the release checklist uses locally: it takes the notes
      # from the matching CHANGELOG.md section, appends the SHA-256 block and
      # uploads the asset under the exact name app/self_updater.py looks for.
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/publish_release.py --version ${{ steps.version.outputs.version }}
