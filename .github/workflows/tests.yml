# Automatic checks for every push and pull request on main.
#
# Why windows-latest: ZapretGUI is a Windows-only app (pywin32, WinDivert,
# taskkill/schtasks handling). Running the suite on Linux would silently skip
# the platform-specific code paths that actually broke in the past.
#
# Qt runs headless via QT_QPA_PLATFORM=offscreen, which tests/conftest.py
# already sets, so no display is required on the runner.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Must match the Python used for local development (currently 3.14).
      # With 3.13 here the suite ran on a different interpreter than the one
      # the release exe is built with, so a break could show up in only one
      # of the two places.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # tools/check_lint.py wraps pyflakes: it skips the vendored
      # app/tg_proxy_engine/ package, ignores the single import-proof line in
      # tests/test_core_logic.py and fails on everything else. Calling pyflakes
      # directly would keep CI permanently red because of the vendored code.
      - name: Static analysis (pyflakes)
        run: python tools/check_lint.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --no-header
