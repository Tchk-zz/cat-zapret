# Automatic checks for every push and pull request on main.
#
# Why windows-latest: ZapretGUI is a Windows-only app (pywin32, WinDivert,
# taskkill/schtasks handling). Running the suite on Linux would silently skip
# the platform-specific code paths that actually broke in the past.
#
# Qt runs headless via QT_QPA_PLATFORM=offscreen, which tests/conftest.py
# already sets, so no display is required on the runner.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Test both the documented minimum and the release-build interpreter.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # tools/check_lint.py wraps pyflakes: it skips the vendored
      # app/tg_proxy_engine/ package, ignores the single import-proof line in
      # tests/test_tg_proxy_logic.py and fails on everything else. Calling pyflakes
      # directly would keep CI permanently red because of the vendored code.
      - name: Static analysis (pyflakes)
        run: python tools/check_lint.py

      - name: Dependency vulnerability scan (OSV)
        run: python tools/check_vulnerabilities.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --no-header
